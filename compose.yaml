services:
  photos:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PHOTOS_DATA_DIR: /data
      PHOTOS_ADMIN_PASSWORD: ${PHOTOS_ADMIN_PASSWORD:?Set a unique password of 12+ characters in a private environment}
      PHOTOS_CORS_ORIGINS: ${PHOTOS_CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - photos_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  photos_data:
