packages:
  - packages/**
  - docs
  - e2e
  - i18n
  - server
  - plugins
  - web
  - .github
  - packages/*
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  bcrypt: true
  better-sqlite3: true
  canvas: false
  core-js: false
  cpu-features: false
  es5-ext: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  ssh2: false
  '@tailwindcss/oxide': true
  core-js-pure: false
  postman-code-generators: false
  unrs-resolver: false
overrides:
  canvas: 3.2.3
  sharp: ^0.35.3
  # 1.9.3-1.9.5 are confirmed broken
  tsc-alias: 1.9.9
  # Reviewed v3 security patch baseline; see docs/GOREECLOUD-DEPENDENCY-TRIAGE-2026-11-07.md
  fast-uri: 3.1.9
  # Documentation dependency advisory fixes: DOMPurify and shell-quote
  dompurify: 3.4.17
  shell-quote: 1.11.0
  # Docs Docusaurus pool: security fixes GHSA-5gmw-xhrv-c9v3 and GHSA-85c8-ppgw-ccpr
  tinypool: 2.2.0
  # Backported GHSA fixes in v1 only; retain unrelated brace-expansion v2/v5 graphs
  'brace-expansion@1': 1.1.20
  # Upstream 1.16.2 fixes request header/redirect handling advisories without major upgrade
  follow-redirects: 1.16.2
  # Joi 17.x patched messages/prototype and validation security advisories
  joi: 17.13.9
  # Express 4 docs tooling security backport; retain direct Photos server body-parser 2.x
  'body-parser@1': 1.20.9
  # SVG script sanitization security backport in existing SVGO v3 line
  svgo: 3.3.5
  # Windows command sanitization security patch in existing 5.x host-metrics line
  systeminformation: 5.33.16
  # Docusaurus MDX metadata image-size parser bounds fixes; inspected v2.0.4 npm artifact
  image-size: 2.0.4
  # Webpack dev server editor-launch Windows path sanitization in maintained 2.x
  launch-editor: 2.14.2
  # Sass transitive immutable v5 DoS fixes (List bounds and hash collisions)
  immutable: 5.1.8
packageExtensions:
  nestjs-kysely:
    dependencies:
      tslib: '*'
  nestjs-otel:
    dependencies:
      tslib: '*'
  '@photo-sphere-viewer/equirectangular-video-adapter':
    dependencies:
      three: '*'
  '@photo-sphere-viewer/video-plugin':
    dependencies:
      three: '*'
  sharp:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  '@immich/ui':
    dependencies:
      tailwindcss: '>=4.1'
  tailwind-variants:
    dependencies:
      tailwindcss: '>=4.1'
  bcrypt:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  '@nestjs/swagger':
    peerDependencies:
      typescript: '*'
dedupePeerDependents: false
preferWorkspacePackages: true
injectWorkspacePackages: true
shamefullyHoist: false
verifyDepsBeforeRun: install
minimumReleaseAgeExclude:
  - '@immich/ui'
  - '@immich/sql-tools@0.7.0'
  - '@nestjs/cli@12.0.1'
  - '@futo-org/*'
