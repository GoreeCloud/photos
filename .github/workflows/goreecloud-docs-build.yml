name: GoreeCloud Photos inherited docs compilation (experimental)

# Dependency compatibility test, NOT permission to deploy inherited Immich docs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-build:
    name: Disposable Docusaurus compilation without user data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      DO_NOT_TRACK: '1'
    steps:
      - name: Checkout no saved GitHub credentials or submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          check-latest: false
      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
      - name: Install lockfile dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
      - name: Build inherited docs in disposable runner
        run: pnpm --dir docs run build
      - name: Verify output without running documentation server
        run: python3 scripts/goreecloud/verify_docs_build.py
