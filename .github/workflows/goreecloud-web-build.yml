name: GoreeCloud Photos isolated web build (experimental)

# Owner-triggered only. Do not run unreviewed dependencies in normal PR CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Disposable web compilation without user data
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      DO_NOT_TRACK: '1'
    steps:
      - name: Checkout without submodules or saved GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Install verified Node.js toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          check-latest: false
      - name: Prepare pinned pnpm in disposable runner
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
          pnpm --version
      - name: Install lockfile dependencies without package lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
      - name: Compile local typed Immich SDK workspace package
        run: pnpm --filter @immich/sdk run build
      - name: Compile inherited web app only (no server, personal assets or deployment)
        run: pnpm --dir web run build
      - name: Verify generated static public branding artifacts
        run: python3 scripts/goreecloud/verify_web_build.py
