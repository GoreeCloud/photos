name: Photos source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Required GoreeCloud repository documentation
        run: |
          for path in docs/ROADMAP.md docs/FEATURES.md docs/OBJECTIVES.md; do
            test -s "$path" || exit 1
          done
      - name: API checks
        working-directory: api
        run: |
          uv sync --frozen --group dev
          uv run --frozen pytest -q
          uv run --frozen ruff check .
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build
  desktop-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile linux/main.py
      - name: Install Qt runtime system libraries
        timeout-minutes: 4
        run: |
          timeout 120s sudo apt-get update -qq -o Acquire::Retries=1
          timeout 90s sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 libegl1 libopengl0 libxkbcommon0 libfontconfig1
      - name: Qt Quick 6.12 headless QML launch smoke
        timeout-minutes: 3
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check -r linux/requirements.txt
          set +e
          timeout 4s env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software python linux/main.py --server http://127.0.0.1:8787 > qt-smoke.log 2>&1
          rc=$?
          set -e
          cat qt-smoke.log
          # Running GUI times out; an import/QML/plugin error exits before timeout.
          test "$rc" -eq 124
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK 35
        run: test -d "$ANDROID_HOME/platforms/android-35"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug client
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
