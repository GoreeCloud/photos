name: Photos source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: API checks
        working-directory: api
        run: |
          uv sync --frozen --group dev
          uv run --frozen pytest -q
          uv run --frozen ruff check .
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build
  desktop-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python and QML source checks
        run: |
          python -m py_compile linux/main.py
          python -m pip install --only-binary=:all: --disable-pip-version-check -r linux/requirements.txt
          pyside6-qmllint linux/Main.qml
      # A full native Qt startup needs Ubuntu system EGL libraries. Perform
      # the runtime acceptance via manual linux-runtime.yml instead of making
      # all protected merges depend on intermittently failing Ubuntu mirrors.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK 35
        run: test -d "$ANDROID_HOME/platforms/android-35"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug client
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
