name: Photos source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Required GoreeCloud repository documentation
        run: |
          for path in docs/ROADMAP.md docs/FEATURES.md docs/OBJECTIVES.md; do
            test -s "$path" || exit 1
          done
      - name: API checks
        working-directory: api
        run: |
          uv sync --frozen --group dev
          uv run --frozen pytest -q
          uv run --frozen ruff check . ../scripts
          uv run --frozen python -m py_compile ../scripts/browser_acceptance.py ../scripts/browser_fixture.py
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web build
        working-directory: web
        run: |
          npm ci
          node --experimental-strip-types --test tests/*.test.mjs
          npm run build
  desktop-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Python and QML source checks
        run: |
          python -m py_compile linux/main.py
          python -m pip install --only-binary=:all: --disable-pip-version-check -r linux/requirements.txt
          pyside6-qmllint linux/Main.qml
      # A full native Qt startup needs Ubuntu system EGL libraries. Perform
      # the runtime acceptance via manual linux-runtime.yml instead of making
      # all protected merges depend on intermittently failing Ubuntu mirrors.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK 35
        run: test -d "$ANDROID_HOME/platforms/android-35"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build Android debug client
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
